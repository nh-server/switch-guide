name: Update Firmware compatibility data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-compat-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and compute compatibility data
        id: compat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-firmware-compatibility.mjs

      - name: Commit updated data
        if: steps.compat.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_internal/firmwareCompatibility.json
          git commit -m "Update firmware compatibility data"
          git push origin master

      - name: Trigger site rebuild
        if: steps.compat.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref master
